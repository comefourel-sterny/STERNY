<!DOCTYPE html>
<html lang="fr">
  <body style="margin:0;padding:0;background:#F4F5F7;font-family:'DM Sans',-apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;">

            <div style="display:inline-block;background:#F4F5F7;border-radius:16px;padding:16px 28px;color:#1E293B;font-size:32px;font-weight:700;letter-spacing:8px;">{{ .Token }}</div>
          </td></tr>
          <tr><td align="center" style="padding-top:24px;color:#94A3B8;font-size:12px;line-height:1.5;">Ce code expire dans 1 heure. Si tu n'es pas à l'origine de cette demande, ignore cet email.</td></tr>
        </table>
      </td></tr>
    </table>
